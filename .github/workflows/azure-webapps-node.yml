name: Build and deploy to Azure Web App

on:
  push:
    branches: ["main"]
    paths:
      - "flashcards-adonisjs/**"
      - ".github/workflows/**"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: flashcards-xxx
  NODE_VERSION: "22.x"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flashcards-adonisjs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flashcards-adonisjs/package-lock.json

      - name: Install and build
        run: |
          npm ci
          node ace build

      - name: Install production dependencies in build
        working-directory: flashcards-adonisjs/build
        run: npm ci --omit=dev

      - uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: flashcards-adonisjs/build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: none
    environment:
      name: Development
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .
